# Easy!Appointments (cup1dstunt fork) for any Docker host, see deploy/docker/README.md.
# Copy .env.example to .env next to this file and fill in the passwords.
#
# Start:  docker compose up -d
# Build locally instead of pulling the image:  docker compose up -d --build

name: easyappointments

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/cup1dstunt/easyappointments:latest}
    # Used only with `--build`: builds from the repository checkout.
    build:
      context: ../..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8090}:80'
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8090}
      LANGUAGE: ${LANGUAGE:-english}
      TZ: ${TZ:-Europe/Berlin}
      DB_HOST: db
      DB_NAME: easyappointments
      DB_USERNAME: easyappointments
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    volumes:
      - storage:/var/www/html/storage

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: easyappointments
      MARIADB_USER: easyappointments
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  storage:
  db:
